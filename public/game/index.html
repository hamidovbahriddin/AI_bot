<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Telegram Game - Flappy Bird</title>
    <link rel="stylesheet" href="style.css">
    <meta name="description" content="Telegram Flappy Bird Game">
    <meta name="keywords" content="flappy bird, telegram game, bird game">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1>🐦 Flappy Bird</h1>
            <div class="score-container">
                <div class="score">Score: <span id="score">0</span></div>
                <div class="high-score">Best: <span id="highScore">0</span></div>
            </div>
        </div>
        
        <div class="game-wrapper">
            <canvas id="gameCanvas" width="400" height="600"></canvas>
            
            <!-- Start Screen -->
            <div class="start-screen" id="startScreen">
                <div class="start-content">
                    <h2>🐦 Flappy Bird</h2>
                    <p>Quvurlardan o'tib ball yig'ing!</p>
                    <button id="playButton" class="play-button">🎮 PLAY</button>
                    <div class="instructions">
                        <p>📱 Mobil: Ekranga bosing</p>
                        <p>⌨️ Kompyuter: Space yoki ↑</p>
                    </div>
                </div>
            </div>
            
            <!-- Game Over Screen -->
            <div class="game-over" id="gameOver" style="display: none;">
                <div class="game-over-content">
                    <h2>Game Over!</h2>
                    <p>Final Score: <span id="finalScore">0</span></p>
                    <button id="restartButton" class="restart-button">🔄 Qayta boshlash</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="telegram-game.js"></script>
    <script src="game.js"></script>
</body>
</html>
